version: '3.8'

services:
  db:
    image: docker.io/pgvector/pgvector:pg16
    environment:
      TZ: 'Europe/Berlin'
      POSTGRES_DB: dwemer
      POSTGRES_USER: dwemer
      POSTGRES_PASSWORD: dwemer
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  web:
    image: ghcr.io/janfuu/chim-php-server:latest
    container_name: chim-php-server
    ports:
      - "8081:80"
    volumes:
      - herika_data_ext:/var/www/html/ext
      - herika_data_conf:/var/www/html/conf
      - herika_data_soundcache:/var/www/html/soundcache
    environment:
      TZ: 'Europe/Berlin'
      DB_HOST: localhost  # Users should change this to their host IP
      DB_PORT: 5432
      DB_NAME: dwemer
      DB_USER: dwemer
      DB_PASSWORD: dwemer

  xtts-api-server:
    image: docker.io/augustobeiro/aiff-xtts-api-server:latest
    container_name: xtts-api-server
    environment:
      TZ: 'Europe/Berlin'
      NVIDIA_VISIBLE_DEVICES: all
    security_opt:
      - label=disable  # For podman compatibility
    ports:
      - "8020:8020"
    volumes:
      - xtts_data:/app/xtts-api-server/xtts-server
    command: >
      bash -c "cd /app/xtts-api-server && python3 -m xtts_api_server --listen -p 8020 -t 'http://localhost:8020' -sf 'xtts-server/speakers' -o 'xtts-server/output' -mf 'xtts-server/models' --deepspeed"
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                device_ids: ['0']
                capabilities: [gpu]

  minime-t5:
    image: ghcr.io/janfuu/minime-t5-docker:latest
    container_name: minime-t5
    environment:
      TZ: 'Europe/Berlin'
      NVIDIA_VISIBLE_DEVICES: all
    security_opt:
      - label=disable
    ports:
      - "8082:8082"
    deploy:
        resources:
          reservations:
            devices:
              - driver: nvidia
                device_ids: ['0']
                capabilities: [gpu]

volumes:
  postgres_data:
  herika_data_ext:
  herika_data_conf:
  herika_data_soundcache:
  xtts_data: